[package]
name = "aerohub-connector-setup"
version = "0.1.0"
description = "AeroHub Connector Setup — instalador com as telas do AeroHub Connector"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Registo do Windows ("Iniciar com o Windows")
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
